global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Independent scrape detects an Alloy failure even when Alloy cannot export.
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
