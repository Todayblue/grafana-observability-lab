# Local reference stack only; not a production/staging deployment template.
name: grafana-alloy-observability

services:
  prometheus:
    image: prom/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19095}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:${LOKI_PORT:-13105}:3100"
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    restart: unless-stopped

  tempo-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data/tempo"]
    volumes:
      - tempo-data:/data/tempo
    restart: "no"

  tempo:
    image: grafana/tempo:3.0.2
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:${TEMPO_PORT:-13205}:3200"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/data/tempo
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "127.0.0.1:${ALLOY_UI_PORT:-12355}:12345"
      - "127.0.0.1:${OTLP_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-14318}:4318"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13305}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set_GRAFANA_ADMIN_PASSWORD_in_dotenv}"
      GF_SECURITY_SECRET_KEY: "${GRAFANA_SECRET_KEY:?Set_GRAFANA_SECRET_KEY_in_dotenv}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Optional, synthetic validation app; NOT part of the default deployment.
  demo-api:
    profiles: ["demo"]
    build: ./demo-api
    depends_on:
      alloy:
        condition: service_started
    ports:
      - "127.0.0.1:${DEMO_API_PORT:-18085}:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    healthcheck:
      test: ["CMD", "dotnet", "demo-api.dll", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: "no"

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
